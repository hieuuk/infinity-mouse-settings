name: Bug report
description: Something doesn't work with your mouse
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Mouse firmware version
      description: Shown at the top of the app window, for example v1.7.6.
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: How is the mouse connected?
      options:
        - USB cable
        - 2.4 GHz receiver
        - Bluetooth
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Linux distribution and version
      placeholder: Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install the app?
      options:
        - .deb package
        - .tar.gz download
        - Built from source
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 0.1.0
  - type: textarea
    id: read
    attributes:
      label: Output of `infinity-mouse-settings --read`
      description: Run this in a terminal with the mouse plugged in and paste the result. It only reads settings and changes nothing.
      render: text
